[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    { include-group = "hooks" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "type" },
]
hooks = [
    "pre-commit>=4.5.1",
]
lint = [
    "ruff>=0.15.5",
]
test = [
    "pytest>=9.0.2",
]
type = [
    "mypy>=1.19.1",
]
